<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill My Form</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        padding: 12px;
        margin: 0;
        box-sizing: border-box;
        color: #1e293b;
      }
      h3 {
        margin: 0 0 10px 0;
        font-size: 1.15rem;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        font-weight: 500;
      }

      button:hover{
        background: #f1f5f9;
      }
      .primary-btn {
        background: #4f46e5;
        color: white;
        border: none;
      }
      .primary-btn:hover {
        background: #4338ca;
      }
      .primary-btn:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
      }
      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        margin-top: 4px;
      }
      .options-link {
        display: block;
        text-align: center;
        font-size: 0.85em;
        color: #4f46e5;
        text-decoration: none;
      }

      #status {
        margin: 8px 0 0;
        font-size: 0.82rem;
        line-height: 1.4;
        min-height: 1.2em;
      }

      #status.error{
        color: #b91c1c;
      }

      #status.ok {
        color: #15803d;
      }
      
      .legend {
        margin-top: 8px;
        font-size: 0.75em;
        color: #64748b;
        display: none;
      }

      .legend span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 4px;
      }

      .legend .green {
        background: #22c55e;
      }

      .legend .yellow {
        background: #eab308;
      }

      .test-banner {
        margin-top: 12px;
        padding: 8px 10px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 6px;
        text-align: center;
      }

      .test-banner-title {
        font-size: 0.75rem;
        color: #1e40af;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .test-btn {
        width: 100%;
        margin-top: 2px;
        padding: 6px;
        font-size: 0.82em;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: 500;
        cursor: pointer;
      }

      .test-btn:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <h3>Fill My Form</h3>
    <label for="profileSelect" style="font-size: 0.88em; font-weight: 500;">Profile</label>
    <select id="profileSelect">
      <option value="">Loading...</option>
    </select>

    <button id="fillButton" class="primary-btn">Fill my Form</button>

    <div id="status"></div>
    <div id="legend" class="legend">
      <div><span class="green"></span>Exact match</div>
      <div><span class="yellow"></span>Close match — worth a glance</div>
    </div>

    <div class="test-banner">
      <div class="test-banner-title">Try it out on a sample form</div>
      <button id="testFormBtn" class="test-btn">Click here to test</button>
    </div>

    <div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px; font-size: 0.8em;">
      <a href="#" id="optionsLink" class="options-link">Manage Profiles</a>
      <span style="color: #cbd5e1;">•</span>
      <a href="/privacy.html" target="_blank" style="color: #64748b; text-decoration: none;">Privacy</a>
    </div>
    <div class="legend"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
