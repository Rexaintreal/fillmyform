<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill My Form - Profiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      :root {
        --bg: #09090b;
        --surface: #09090b;
        --surface-2: #121215;
        --surface-3: #18181b;
        --border: #27272a;
        --border-2: #3f3f46;
        --accent: #fafafa;
        --accent-dark: #e4e4e7;
        --text-1: #fafafa;
        --text-2: #a1a1a1;
        --text-3: #71717a;
        --success: #22c55e;
        --warning: #eab308;
        --danger: #ef4444;
        --danger-dark: #dc2626;
        --r: 8px;
        --r-sm: 6px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --t: 0.15s;
      }

      html {
        font-size: 14px;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        line-height: 1.55;
        letter-spacing: -0.01em;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 56px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 80;
        gap: 12px;
      }

      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .topbar-logo {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        flex-shrink: 0;
        background: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 800;
        color: #09090b;
      }

      .topbar-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-1);
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      .topbar-sub {
        font-size: 0.65rem;
        color: var(--text-3);
      }

      .topbar-search-wrap {
        flex: 1;
        max-width: 320px;
        position: relative;
      }

      .topbar-search {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 6px 12px 6px 30px;
        font-size: 0.8rem;
        color: var(--text-1);
        font-family: inherit;
        outline: none;
        transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
      }

      .topbar-search::placeholder {
        color: var(--text-3);
      }
      
      .topbar-search:hover {
        border-color: var(--border-2);
      }

      .topbar-search:focus {
        border-color: #71717a;
        box-shadow: 0 0 0 1px #71717a;
      }

      .topbar-search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        font-size: 0.8rem;
        pointer-events: none;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .unsaved-badge {
        font-size: 0.68rem;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 4px;
        background: rgba(234, 179, 8, 0.1);
        color: #fef08a;
        border: 1px solid rgba(234, 179, 8, 0.25);
        display: none;
        align-items: center;
        gap: 4px;
      }

      .unsaved-badge.visible{
        display: flex;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: var(--r-sm);
        font-size: 0.78rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease);
        white-space: nowrap;
        font-family: inherit;
        line-height: 1.4;
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border: 1px solid var(--border);
      }

      .btn-ghost:hover {
        background: var(--surface-3);
        color: var(--text-2);
        border: 1px solid var(--border);
      }

      .btn-accent {
        background: #fafafa;
        color: #09090b;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .btn-accent:hover {
        background: #e4e4e7;
      }
      .btn-success {
        background: #fafafa;
        color: #09090b;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-success:hover {
        background: #e4e4e7;
      }
      .btn-danger {
        background: transparent;
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.25);
      }

      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.4);
      }

      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .main-layout {
        display: flex;
        flex: 1;
      }

      .sidebar-label {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--text-3);
        text-transform: uppercase;
      }

      .profile-list {
        flex: 1;
        padding: 0 6px 10px;
      }

      .profile-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: var(--r-sm);
        cursor: pointer;
        margin-bottom: 2px;
        transition: background-color var(--t) var(--ease);
        position: relative;
      }

      .profile-item:hover {
        background: var(--surface-2);
      }

      .profile-item.active {
        background: var(--surface-3);
        border: 1px solid var(--border);
      }
      .profile-avatar {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
        color: #09090b;
        background: #fafafa;
      }
      .profile-info {
        min-width: 0;
      }

      .profile-name { 
        font-size: 0.8rem; 
        font-weight: 500; 
        color: var(--text-1); 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
      }
      .profile-count{
        font-size: 0.8rem;
        color: var(--text-3);
      }
      .sidebar-footer{
        padding:10px 8px; 
        border-top: 1px solid var(--border);
      }
      .sidebar-footer .btn {width: 100%;
      justify-content: center;
    }
    .content {
      flex: 1;
    padding: 24px 32px 48px;
    overflow-y: auto;
    max-width: 900px;
   }
   .empty-state {
    display:flex;
  flex-direction: column;
  align-items: center;
  }
  .empty-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--r);
    background: #fafafa;
    color: #09090b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 18px;
  } 
  .empty-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .empty-text  { 
    color: var(--text-2); 
    font-size: 0.85rem; 
    max-width: 360px; 
    line-height: 1.6; 
    margin-bottom: 24px;
  }
  .empty-steps {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .empty-step {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px 14px;
    text-align: left;
    max-width: 180px;
  }
  .step-num {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    flex-shrink 0;
    background: var(--surface-3);
    border: 1px solid var(--border-2);
    color: var(--text-1);
    font-size: 0.65rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .step-text {
    font-size: 0.75rem;
    color: var(--text-2);
    line-height: 1.45;
  }
  .step-text strong {
    color: var(--text-1);
    display: block;
    margin-bottom: 2px;
    font-size: 0.78rem;
  }
  .editor {
    display: none;
  }
  .editor.visible {
    display: block;
  }
  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 14px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .editor-titile-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .editor-avatar {
    width: 34px;
    height: 34px;
    border-radius: var(--r-sm);
    flex-shrink: 0;
    background: #fafafa;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    font-weight: 700;
  }
  .profile-name-input {

    background: transparent;
    border: none;
    outline: none;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-1);
    font-family: inherit;
    width: auto;
    min-width: 80px;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
    transition: border-color var(--t) var(--ease);
    letter-spacing: -0.015em;
    cursor: text;
  }
  .profile-name-input:focus {
    border-bottom-color: #71717a;
  }
  .profile-name-hint { 
    font-size: 0.65rem;
    color: var(--text-3);
    margin-top: 2px;
  }
  .editor-actions { 
    display: flex;
     align-items: center;
      gap: 8px;
  }
  .progress-card{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .progress-info { 
    flex: 1;
  }
  .progress-label { 
    font-size: 0.74rem;
    color: var(--text-2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .progress-track {
    height: 4px;
    background: var(--surface-3);
    border-radius: 9999px;
    overflow: hidden;
  }
  .progress-fill { 
    height: 100%;
    border-radius: 9999px;
    background: #fafafa;
    transition: width 0.35s var(--ease);
  }
  .progress-pct {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .progress-sub {
    font-size: 0.63rem;
    color: var(--text-3);
  }
  .tools-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .field-group {
    margin-bottom: 20px;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
    padding: 4px;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
    padding: 4px 0;
  }
  .group-toggle-icon {
    font-size: 0.55rem;
    color: var(--text-3);
    transition: transform var(--t) var(--ease);
    flex-shrink: -;
    margin-left: 2px;
  }
  .field-group.collapsed .group-toggle-icon {
    transform: rotate(-90deg);
  }
  .field-group.collapsed .group-body  { 
    display: none;
  }
  .group-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-3);
  }
  .group-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .group-badge {
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(var(--text-3));
    font-weight: 500;
    margin-left: auto;
  }
  .group-badge.complete {
    background: var(--surface-3);
    border-color: var(--border-2);
    color: var(--text-2);
  }
  .fields-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 8px;
  }
  .field-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 11px 12px;
    transition: border-color var(--t) var(--ease);
    position: relative;
  }
  .field-card:hover {
    border-color: var(--border-2);
  }
  .field-card:focus-within {
    border-color: #71717a;
  }
  .field-card:has-value {
    border-color: var(--border);
  }
  .field-card:empty-value {
    opacity: 0.85;
  }
  .field-card:empty-value:hover,
  .field-card.empty-value:focus-within {
    opacity: 1;
  }
  .field-card.custom-field {
    border-style: dashed;
  }
  .field-card.custom-field{border-style: dashed;}
  .field-card.hidden-by-search {
    display: none;
  }
  .field-card.has-value::after {
    content: '';
    position: absolute;
    top: 9px;
    right: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fafafa;
    opacity: 0.6;
  }
  .field-label-row {
    display: flex; 
    align-items: center; 
    gap: 6px; 
    margin-bottom: 6px; 
    padding-right: 14px;
  }
  .field-label {
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--text-2);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-family: inherit;
    min-width: 0;
  }
  .field-label-input:focus {
    color: var(--text-1);
  }
  .field-label-input::placeholder { 
    color: var(--text-3);
  }
  .field-type-badge {
    margin-left: auto;
    font-size: 0.58rem;
    padding: 1px 4px;
    border-radius: 3px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    color:var(--text-3);
    font-weight: 500;
    flex-shrink: 0;
  }
  .field-value-input {
    width: 100%;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text-1);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 7px 9px;
    outline: none;
    transition: border-color var(--t) var(--ease), background var(--t) var(--ease);
  }
  .field-value-input::placeholder {
    color: var(--text-3);
    font-size: 0.78rem;
  }
  .field-value-input:hover { 
    border-color: var(--border-2);
  }
  .field-value-input:focus {
    border-color: #71717a;
    background: var(--bg);
    box-shadow: 0 0 0 1px #71717a;
  }
  .field-value-input.filled {
    border-color: var(--border);
  }
  .custom-type-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
    </style>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="topbar-logo">F</div>
          <div>
            <div class="topbar-title">Fill My Form</div>
            <div class="topbar-sub">Profile Manager</div>
          </div>
        </div>
        <div class="topbar-search-wrap">
          <span class="topbar-search-icon">plzaddsearchlogoherelaterimtoolazyhehe</span>
          <input type="search" id="fieldSearch" class="topbar-search" placeholder="Search fields..." aria-label="Search fields">
        </div>

        <div class="topbar-actions">
          <div class="unsaved-badge" id="unsavedBadge">Unsaved</div>
          <button id="importBtn" class="btn btn-ghost">Import</button>
          <button id="exportBtn" class="btn btn-ghost" disabled>Export</button>
          <a href="/privacy.html" target="_blank" class="btn btn-ghost" style="text-decoration: none;">Privacy</a>
        </div>
      </header>
    </div>
    <script type="module" src="./options.ts"></script>

    <div class="main-layout">
      <nav class="sidebar" role="navigation" aria-label="Profile list">
        <div class="sidebar-header">
          <span class="siderbar-label">Profiles</span>
        </div>
        <ul class="profile-list" id="profileList" role="list"></ul>
        <div class="sidebar-footer">
          <button id="newProfileBtn" class="btn btn-accent">+ New Profile</button>
        </div>
      </nav>
    </div>
  </body>
</html>
