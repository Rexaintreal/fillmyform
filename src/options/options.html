<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill My Form - Profiles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      :root {
        --bg: #09090b;
        --surface: #09090b;
        --surface-2: #121215;
        --surface-3: #18181b;
        --border: #27272a;
        --border-2: #3f3f46;
        --accent: #fafafa;
        --accent-dark: #e4e4e7;
        --text-1: #fafafa;
        --text-2: #a1a1a1;
        --text-3: #71717a;
        --success: #22c55e;
        --warning: #eab308;
        --danger: #ef4444;
        --danger-dark: #dc2626;
        --r: 8px;
        --r-sm: 6px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --t: 0.15s;
      }

      html {
        font-size: 14px;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        line-height: 1.55;
        letter-spacing: -0.01em;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
      }

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        height: 56px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 80;
        gap: 12px;
      }

      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .topbar-logo {
        width: 24px;
        height: 24px;
        border-radius: 5px;
        flex-shrink: 0;
        background: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 800;
        color: #09090b;
      }

      .topbar-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-1);
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      .topbar-sub {
        font-size: 0.65rem;
        color: var(--text-3);
      }

      .topbar-search-wrap {
        flex: 1;
        max-width: 320px;
        position: relative;
      }

      .topbar-search {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 6px 12px 6px 30px;
        font-size: 0.8rem;
        color: var(--text-1);
        font-family: inherit;
        outline: none;
        transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
      }

      .topbar-search::placeholder {
        color: var(--text-3);
      }
      
      .topbar-search:hover {
        border-color: var(--border-2);
      }

      .topbar-search:focus {
        border-color: #71717a;
        box-shadow: 0 0 0 1px #71717a;
      }

      .topbar-search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-3);
        font-size: 0.8rem;
        pointer-events: none;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .unsaved-badge {
        font-size: 0.68rem;
        font-weight: 500;
        padding: 2px 7px;
        border-radius: 4px;
        background: rgba(234, 179, 8, 0.1);
        color: #fef08a;
        border: 1px solid rgba(234, 179, 8, 0.25);
        display: none;
        align-items: center;
        gap: 4px;
      }

      .unsaved-badge.visible{
        display: flex;
      }


      .page {
        max-width: 1050px;
        margin: 0 auto;
        padding: 36px 24px 60px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      .brand h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 7px 0 0;
        color: #64748b;
        font-size: 14px;
      }

      .top-actions {
        display: flex;
        gap: 8px;
      }

      button {
        border: 1px solid #cbd5e1;
        background: white;
        color: #334155;
        border-radius: 6px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover {
        background: #f8fafc;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .primary-btn {
        background: #4f46e5;
        border-color: #4f46e5;
        color: white;
      }

      .primary-btn:hover {
        background: #4338ca;
      }

      .danger-btn {
        color: #b91c1c;
        border-color: #fecaca;
      }

      .danger-btn:hover {
        background: #fef2f2;
      }

      .layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 18px;
      }

      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
      }

      .sidebar {
        padding: 16px;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .sidebar-header h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      #profileList {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .profile-item {
        padding: 9px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        color: #475569;
        margin-bottom: 2px;
      }

      .profile-item:hover {
        background: #f1f5f9;
      }

      .profile-item.active {
        background: #eef2ff;
        color: #3730a3;
        font-weight: 600;
      }

      .empty-profiles {
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.5;
        padding: 8px 4px;
      }

      .editor {
        padding: 22px;
      }

      .editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 18px;
        border-bottom: 1px solid #e2e8f0;
      }

      .editor-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
      }

      .editor-header p {
        margin: 5px 0 0;
        color: #64748b;
        font-size: 12px;
      }

      .fields {
        padding-top: 18px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr 110px 36px;
        gap: 8px;
        align-items: center;
        margin-bottom: 9px;
      }

      .field-row input,
      .field-row select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        padding: 8px 9px;
        font-size: 13px;
        color: #0f172a;
        background: white;
        outline: none;
      }

      .field-row input:focus,
      .field-row select:focus {
        border-color: #818cf8;
        box-shadow: 0 0 0 2px #eef2ff;
      }

      .remove-field {
        width: 36px;
        height: 34px;
        padding: 0;
        color: #94a3b8;
        font-size: 16px;
      }

      .remove-field:hover {
        color: #b91c1c;
        background: #fef2f2;
      }

      .add-field {
        margin-top: 5px;
      }

      .editor-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
      }

      .left-actions,
      .right-actions {
        display: flex;
        gap: 8px;
      }

      .empty-editor {
        padding: 70px 30px;
        text-align: center;
        color: #64748b;
      }

      .empty-editor h2 {
        margin: 0 0 7px;
        color: #334155;
        font-size: 18px;
      }

      .empty-editor p {
        margin: 0;
        font-size: 13px;
      }

      .info {
        margin-top: 18px;
        padding: 13px 15px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 7px;
        color: #64748b;
        font-size: 12px;
        line-height: 1.5;
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        color: #94a3b8;
        font-size: 11px;
      }

      @media (max-width: 750px) {
        .topbar {
          flex-direction: column;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .field-row {
          grid-template-columns: 1fr;
        }

        .remove-field {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="topbar-logo">F</div>
          <div>
            <div class="topbar-title">Fill My Form</div>
            <div class="topbar-sub">Profile Manager</div>
          </div>
        </div>
        <div class="topbar-search-wrap">
          <span class="topbar-search-icon">plzaddsearchlogoherelaterimtoolazyhehe</span>
          <input type="search" id="fieldSearch" class="topbar-search" placeholder="Search fields..." aria-label="Search fields">
        </div>

        <div class="topbar-actions">
          <div class="unsaved-badge" id="unsavedBadge">Unsaved</div>
          <button id="importBtn" class="btn btn-ghost">Import</button>
          <button id="exportBtn" class="btn btn-ghost" disabled>Export</button>
          <a href="/privacy.html" target="_blank" class="btn btn-ghost" style="text-decoration: none;">Privacy</a>
        </div>
      </header>
    </div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
